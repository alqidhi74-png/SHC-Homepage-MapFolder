<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script>
        (() => {
            let authenticated = false;
            try {
                const profile = JSON.parse(localStorage.getItem('sh_site_profile_v2') || 'null');
                authenticated = localStorage.getItem('sh_site_logged_in_v2') === '1' && profile?.role === 'citizen';
            } catch (_) {}
            if (!authenticated) {
                const returnTo = location.pathname + location.search + location.hash;
                location.replace('/login?returnTo=' + encodeURIComponent(returnTo));
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../../assets/logo.png">
    <title>جولة افتراضية | فيلا الواحة</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        burgundy: {
                            DEFAULT: '#49111D',
                            hover: '#380D16',
                        },
                        gold: {
                            DEFAULT: '#DBC47D',
                            hover: '#C9B168',
                        },
                    },
                    fontFamily: {
                        sans: ['IBM Plex Sans Arabic', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Arabic typography -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="../../chatbot.js" defer data-shc-chatbot-loader></script>

    <!-- GSAP Animation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <!-- Three.js Import Map -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <style>
        body {
            font-family: "IBM Plex Sans Arabic", sans-serif;
            overflow-x: hidden;
        }

        button, input, select, textarea {
            font-family: inherit;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            height: 4px;
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #49111D;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #DBC47D;
        }

        /* keyframes للظهور مع حركة خفيفة للأعلى والتلاشي */
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(15px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .animate-room-btn {
            animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* طبقة الترانزيشن بين الصفحات باللون البرغندي */
        #page-transition-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #28070e 0%, #49111D 50%, #1e050a 100%);
            z-index: 99999;
            pointer-events: none;
            transform: translateY(0%);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between overflow-hidden">

    <!-- عنصر الترانزيشن التفاعلي للانتقال -->
    <div id="page-transition-overlay"></div>

    <!-- Header Navigation -->
    <header class="absolute top-0 right-0 left-0 z-30 bg-gradient-to-b from-black/60 to-transparent p-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <!-- زر الرجوع المضاف بنفس التصميم والألوان -->
            <a href="UPDATE.html" id="backBtn" class="flex items-center gap-2 bg-burgundy hover:bg-burgundy-hover text-gold font-bold px-3 py-2 rounded-xl border border-gold/40 shadow-lg transition duration-200 text-xs md:text-sm">
                <i class="fa-solid fa-arrow-right"></i>
                <span>العودة المعرض</span>
            </a>

            <div>
                <h1 class="text-lg md:text-xl font-bold tracking-wide text-gold">مشروع فيلا الواحة</h1>
                <p class="text-xs text-burgundy font-medium">جولة افتراضية تفاعلية </p>
            </div>
        </div>
    </header>

    <!-- Main Viewport Container -->
    <main class="relative w-full h-screen">
        <div id="canvas-container" class="w-full h-full bg-slate-900"></div>

        <!-- Floating Controls Bar -->
        <div class="absolute top-20 right-4 z-20 flex flex-col gap-2 p-2">
            <button onclick="zoomIn()" title="تكبير" class="w-10 h-10 bg-burgundy hover:bg-burgundy-hover text-gold rounded-lg transition flex items-center justify-center border border-gold/30 shadow-lg">
                <i class="fa-solid fa-plus text-lg"></i>
            </button>
            <button onclick="zoomOut()" title="تصغير" class="w-10 h-10 bg-burgundy hover:bg-burgundy-hover text-gold rounded-lg transition flex items-center justify-center border border-gold/30 shadow-lg">
                <i class="fa-solid fa-minus text-lg"></i>
            </button>
            <button onclick="toggleAutoRotate()" id="rotateBtn" title="دوران تلقائي" class="w-10 h-10 bg-burgundy hover:bg-burgundy-hover text-gold rounded-lg transition flex items-center justify-center border border-gold/30 shadow-lg">
                <i class="fa-solid fa-arrows-spin text-lg"></i>
            </button>
            <button onclick="toggleFullscreen()" title="ملء الشاشة" class="w-10 h-10 bg-burgundy hover:bg-burgundy-hover text-gold rounded-lg transition flex items-center justify-center border border-gold/30 shadow-lg">
                <i class="fa-solid fa-expand text-lg"></i>
            </button>
        </div>

        <!-- Room Name Indicator -->
        <div class="absolute top-20 left-4 z-20 bg-burgundy px-4 py-2 rounded-xl border border-gold/40 shadow-lg flex items-center gap-2">
            <i class="fa-solid fa-location-dot text-gold"></i>
            <span id="currentRoomTitle" class="text-sm font-bold text-gold">الصالة الرئيسية</span>
        </div>
    </main>

    <!-- Bottom Room Selection Navigation -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-30 w-auto max-w-2xl p-2 flex flex-col items-center justify-center gap-3">
        <!-- Floor Tabs -->
        <div class="flex justify-center gap-2 w-full">
            <button onclick="switchFloor('ground')" id="tab-ground" class="floor-tab text-xs font-semibold px-4 py-2 rounded-xl transition bg-burgundy text-gold border border-gold shadow-xl">
                الطابق الأرضي
            </button>
            <button onclick="switchFloor('first')" id="tab-first" class="floor-tab text-xs font-semibold px-4 py-2 rounded-xl transition bg-burgundy text-gold/70 hover:text-gold border border-gold/20 shadow-xl">
                الطابق الأول
            </button>
        </div>

        <!-- Dynamic Room Buttons -->
        <div id="roomsContainer" class="flex justify-center items-center gap-2 overflow-x-auto max-w-full min-h-[40px]">
            <!-- يتم إضافة الأزرار هنا ديناميكياً مع الحركة والتأخير -->
        </div>
    </div>

    <!-- Page Transition Logic Script -->
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            // حركة دخول الصفحة عند التحميل
            gsap.to("#page-transition-overlay", {
                y: "-100%",
                duration: 0.8,
                ease: "power3.inOut"
            });

            // ربط زر العودة بالحركة الانسيابية
            const backBtn = document.getElementById("backBtn");
            if (backBtn) {
                backBtn.addEventListener("click", (e) => {
                    e.preventDefault();
                    gsap.set("#page-transition-overlay", { y: "100%" });

                    gsap.timeline()
                        .to("#page-transition-overlay", {
                            y: "0%",
                            duration: 0.7,
                            ease: "power3.inOut"
                        })
                        .add(() => {
                            window.location.href = "UPDATE.html";
                        });
                });
            }
        });
    </script>

    <!-- JavaScript 3D Logic -->
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';
        import { EXRLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/EXRLoader.js';

        const villaData = {
            ground: [
                {
                    id: 'living_room',
                    name: 'الصالة الرئيسية',
                    panorama: 'lythwood_lounge_4k.exr',
                    type: 'exr'
                },
                {
                    id: 'kitchen',
                    name: 'دورة المياه',
                    panorama: 'modern_bathroom_4k.exr',
                    type: 'exr'
                }
            ],
            first: [
                {
                    id: 'master',
                    name: 'جناح النوم الرئيسي',
                    panorama: 'relax_inn_seaview_suite_4k.exr',
                    type: 'exr'
                },
                {
                    id: 'bathroom',
                    name: 'دورة المياه',
                    panorama: 'en_suite_4k.exr',
                    type: 'exr'
                },
                {
                    id: 'bedroom2',
                    name: 'غرفة نوم ثانوية',
                    panorama: 'hotel_room_4k.exr',
                    type: 'exr'
                }
            ]
        };

        let scene, camera, renderer, controls, sphereMesh;
        let currentFloor = 'ground';
        let renderTimeout = null;
        const container = document.getElementById('canvas-container');

        // 1. تهيئة Three.js
        function initThreeJS() {
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 0, 0.1);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableZoom = false;
            controls.enablePan = false;
            controls.rotateSpeed = -0.4;

            const geometry = new THREE.SphereGeometry(500, 60, 40);
            geometry.scale(-1, 1, 1);
            const material = new THREE.MeshBasicMaterial();
            sphereMesh = new THREE.Mesh(geometry, material);
            scene.add(sphereMesh);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        // 2. تحميل صورة الغرفة (360)
        function loadRoomPanorama(room) {
            document.getElementById('currentRoomTitle').innerText = room.name;

            if (room.type === 'exr') {
                sphereMesh.visible = false;
                const exrLoader = new EXRLoader();
                exrLoader.load(room.panorama, (texture) => {
                    texture.mapping = THREE.EquirectangularReflectionMapping;
                    scene.background = texture;
                    scene.environment = texture;
                }, undefined, (err) => {
                    console.error("خطأ في تحميل ملف EXR:", err);
                });
            } else {
                scene.background = null;
                scene.environment = null;
                sphereMesh.visible = true;

                const textureLoader = new THREE.TextureLoader();
                textureLoader.load(room.panorama, (texture) => {
                    texture.colorSpace = THREE.SRGBColorSpace;
                    sphereMesh.material.map = texture;
                    sphereMesh.material.needsUpdate = true;
                });
            }
        }

        function onWindowResize() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // 3. عرض أزرار الغرف بتأخير 3 ثوانٍ وحركة انسيابية
        function renderRoomThumbnailsWithDelay() {
            const containerBtns = document.getElementById('roomsContainer');
            
            // مسح الأزرار الحالية وإلغاء أي مؤقت سابق
            containerBtns.innerHTML = '';
            if (renderTimeout) clearTimeout(renderTimeout);

            const rooms = villaData[currentFloor] || [];

            // تحميل الغرفة الأولى فوراً في الخلفية
            if (rooms.length > 0) {
                loadRoomPanorama(rooms[0]);
            }

            // تأخير ظهور الأزرار لمدة 3 ثوانٍ (3000ms)
            renderTimeout = setTimeout(() => {
                rooms.forEach((room, index) => {
                    const btn = document.createElement('button');
                    
                    // إضافة كلاسات الحركة والتنسيق
                    btn.className = `opacity-0 animate-room-btn flex-shrink-0 p-2 px-3.5 rounded-xl border text-xs font-semibold transition duration-200 bg-burgundy shadow-lg ${
                        index === 0 
                        ? 'border-gold text-gold font-bold' 
                        : 'border-gold/20 text-gold/70 hover:text-gold hover:border-gold/50'
                    }`;
                    
                    // تأخير خفيف بين كل زر والآخر لجعل الحركة متتابعة وجذابة
                    btn.style.animationDelay = `${index * 0.1}s`;

                    btn.onclick = () => {
                        document.querySelectorAll('#roomsContainer button').forEach(b => {
                            b.classList.remove('border-gold', 'text-gold', 'font-bold');
                            b.classList.add('border-gold/20', 'text-gold/70');
                        });
                        btn.classList.add('border-gold', 'text-gold', 'font-bold');
                        btn.classList.remove('border-gold/20', 'text-gold/70');

                        loadRoomPanorama(room);
                    };

                    btn.innerHTML = `<span class="whitespace-nowrap">${room.name}</span>`;
                    containerBtns.appendChild(btn);
                });
            }, 3000);
        }

        // التبديل بين الطوابق
        window.switchFloor = function(floorKey) {
            currentFloor = floorKey;
            
            // تحديث حالة أزرار الطوابق فوراً
            document.querySelectorAll('.floor-tab').forEach(tab => {
                tab.classList.remove('border-gold', 'text-gold');
                tab.classList.add('border-gold/20', 'text-gold/70');
            });
            const activeTab = document.getElementById(`tab-${floorKey}`);
            if (activeTab) {
                activeTab.classList.add('border-gold', 'text-gold');
                activeTab.classList.remove('border-gold/20', 'text-gold/70');
            }

            // إعادة بناء الأزرار بتأخير الـ 3 ثوانٍ والحركة
            renderRoomThumbnailsWithDelay();
        };

        // التحكم بالزوم والدوران
        window.zoomIn = function() {
            if (camera.fov > 30) {
                camera.fov -= 10;
                camera.updateProjectionMatrix();
            }
        };

        window.zoomOut = function() {
            if (camera.fov < 100) {
                camera.fov += 10;
                camera.updateProjectionMatrix();
            }
        };

        window.toggleAutoRotate = function() {
            controls.autoRotate = !controls.autoRotate;
            controls.autoRotateSpeed = 0.5;
            const btn = document.getElementById('rotateBtn');
            if (controls.autoRotate) {
                btn.classList.add('bg-burgundy-hover', 'border-gold');
            } else {
                btn.classList.remove('bg-burgundy-hover', 'border-gold');
            }
        };

        window.toggleFullscreen = function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        };

        // تشغيل التطبيق عند التحميل
        initThreeJS();
        renderRoomThumbnailsWithDelay();
    </script>
</body>
</html>
