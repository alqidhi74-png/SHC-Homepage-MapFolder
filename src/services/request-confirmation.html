<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تأكيد الطلب — مدينة السلطان هيثم</title>
<script>try{if(sessionStorage.getItem('sh_arrive'))document.documentElement.classList.add('arriving');}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-lang="ar" data-page="confirm">

<div class="page-canvas">
  <div class="site-frame">
    <div class="site-header">
      <div class="logo-group">
        <button class="back-arrow show" id="back-arrow-btn" type="button" aria-label="رجوع" title="رجوع"
          data-chapter="الفصل الرابع · المراجعة والتوقيع" data-line="راجع، أقرّ، ووقّع إلكترونياً"><span>→</span></button>
        <div class="logo-mark">SH</div>
        <div class="logo-word"><b data-i18n="brand-ar">مدينة السلطان هيثم</b><span data-i18n="brand-en">SULTAN HAITHAM CITY</span></div>
      </div>
      <div class="header-actions">
        <a class="header-svc-btn" href="services-catalog.html" data-dir="left" data-chapter="الفصل الأول · دليل الخدمات" data-line="اختر الخدمة، والباقي مرتّب لك">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M15 9l-2 6-6 2 2-6 6-2Z"/></svg>
          <span class="lbl" data-i18n="services-guide">دليل الخدمات</span>
        </a>
        <button class="header-icon-btn" id="header-lang-btn" type="button" title="تغيير اللغة">EN</button>
        <button class="header-icon-btn device" id="header-device-btn" type="button" title="عرض النظام">📱</button>
      </div>
    </div>

    <div class="chapter-strip" style="--ch-accent:#3D4E1E;">
      <div class="ch-mark">٥</div>
      <div class="ch-text"><b>الفصل الخامس · تأكيد الطلب</b><p>طلبك في الطريق، واحتفظ بإيصالك</p></div>
      <div class="ch-spine">
        <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on here"></i><i></i><i></i>
      </div>
    </div>

    <div class="sys-wrap">
      <div class="sys-confirm">
        <div class="sys-confirm-check">✓</div>
        <h1 style="font-family:var(--font-display);color:var(--velvet);font-size:22px;margin:0;" data-i18n="confirm-title">تم إرسال الطلب بنجاح</h1>
        <p style="color:var(--ink-soft);font-size:13px;" data-i18n="confirm-sub">سيتم إشعارك بأي تحديث على حالة الطلب</p>
        <div class="sys-confirm-num" id="confirm-num">رقم الطلب: —</div>
        <div class="sys-confirm-meta">
          <div><span data-i18n="service-type">نوع الخدمة</span><span id="confirm-service">—</span></div>
          <div><span data-i18n="submit-date">تاريخ التقديم</span><span id="confirm-date">—</span></div>
          <div><span data-i18n="status">الحالة</span><span class="sys-badge progress" data-i18n="status-review">قيد المراجعة</span></div>
        </div>
        <div style="display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;">
          <a class="btn-gold" style="flex:1;justify-content:center;" href="request-tracking.html" data-dir="down" data-chapter="الفصل السادس · تتبع الطلب" data-line="تابع مسار طلبك من الاستلام حتى الاعتماد" data-i18n="track-request">تتبع الطلب</a>
          <button type="button" id="btn-download-receipt" class="btn-receipt-ready btn-ghost" style="flex:1;" data-i18n="download-receipt">⬇ تحميل الإيصال</button>
          <a class="btn-ghost return-services-btn" style="flex:1;" href="services-catalog.html" data-dir="left">العودة إلى الخدمات</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
const state = loadState();
if(!state.requestNumber){
  navigateWithTransition('request-review.html', 'left', 'الفصل الرابع · المراجعة والتوقيع', 'راجع، أقرّ، ووقّع إلكترونياً');
}
const svc = SERVICE_CATALOG[state.serviceId] || SERVICE_CATALOG['realestate-reg'];
document.getElementById('confirm-num').textContent = 'رقم الطلب: ' + (state.requestNumber || '—');
document.getElementById('confirm-service').textContent = state.type || svc.requestType;
document.getElementById('confirm-date').textContent = state.submittedAt || '—';

document.getElementById('btn-download-receipt')?.addEventListener('click', ()=>{
  const num = state.requestNumber || 'SR-2026-0000';
  const receiptHtml = `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>إيصال ${num}</title>
<style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap');
body{font-family:"IBM Plex Sans Arabic",sans-serif;background:#fbf6ea;padding:32px;color:#2B1216}
.box{max-width:520px;margin:0 auto;background:#fff;border:2px solid #B39157;border-radius:14px;padding:28px}
h1{color:#49111D;font-size:22px;margin:0 0 8px}.meta{font-size:13px;line-height:2}.stamp{border:2px dashed #B39157;border-radius:10px;padding:14px;text-align:center;margin-top:18px;color:#49111D;font-weight:700}
</style></head><body><div class="box">
<h1>إيصال تقديم طلب — مدينة السلطان هيثم</h1>
<p class="meta"><b>رقم الطلب:</b> ${num}<br>${state.citizen ? `<b>مقدم الطلب:</b> ${escapeHtml(state.citizen.fullName)} — ${escapeHtml(state.citizen.civilId)}<br>` : ''}<b>نوع الخدمة:</b> ${escapeHtml(state.type || svc.title)}<br><b>التاريخ:</b> ${state.submittedAt || ''}<br><b>الرسوم:</b> ${svc.fee || '—'}<br><b>الحالة:</b> قيد المراجعة</p>
<div class="stamp">✓ تم استلام الطلب إلكترونياً</div>
<p style="font-size:11px;color:#6b5559;margin-top:16px;text-align:center">يمكنك طباعة هذه الصفحة (PDF) من المتصفح</p>
</div></body></html>`;
  const blob = new Blob([receiptHtml], {type:'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'ايصال-' + num + '.html';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 2000);
  showToast('تم تنزيل الإيصال', 'success');
});
</script>
</body>
</html>
