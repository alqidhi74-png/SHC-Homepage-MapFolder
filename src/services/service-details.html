<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تفاصيل الخدمة — مدينة السلطان هيثم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-lang="ar" data-page="detail">

<div class="page-canvas">
  <div class="site-frame">
    <div class="site-header">
      <div class="logo-group">
        <button class="back-arrow show" id="back-arrow-btn" type="button" aria-label="رجوع" title="رجوع"
          data-chapter="الفصل الأول · دليل الخدمات" data-line="اختر الخدمة، والباقي مرتّب لك"><span>→</span></button>
        <div class="logo-mark">SH</div>
        <div class="logo-word"><b data-i18n="brand-ar">مدينة السلطان هيثم</b><span data-i18n="brand-en">SULTAN HAITHAM CITY</span></div>
      </div>
      <div class="header-actions">
        <a class="header-svc-btn" href="services-catalog.html" data-dir="left" data-chapter="الفصل الأول · دليل الخدمات" data-line="اختر الخدمة، والباقي مرتّب لك">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M15 9l-2 6-6 2 2-6 6-2Z"/></svg>
          <span class="lbl" data-i18n="services-guide">دليل الخدمات</span>
        </a>
        <button class="header-icon-btn" id="header-lang-btn" type="button" title="تغيير اللغة">Ar / En</button>
        <button class="header-icon-btn device" id="header-device-btn" type="button" title="عرض النظام">📱</button>
      </div>
    </div>

    <div class="chapter-strip" style="--ch-accent:#3D4E1E;">
      <div class="ch-mark">٢</div>
      <div class="ch-text"><b>الفصل الثاني · تفاصيل الخدمة</b><p>اعرف المستندات والمدة قبل أن تبدأ</p></div>
      <div class="ch-spine">
        <i class="on"></i><i class="on here"></i><i></i><i></i><i></i><i></i><i></i>
      </div>
    </div>

    <div class="sys-wrap">
      <p style="font-size:12px;color:var(--ink-soft);margin-bottom:14px;" id="s9-breadcrumb">دليل الخدمات / …</p>
      <div class="svc-grid" style="grid-template-columns:2fr 1fr;">
        <div class="sys-review">
          <div class="svc-ic" style="width:56px;height:56px;" id="s9-icon"></div>
          <h1 style="font-family:var(--font-display);color:var(--velvet);font-size:22px;margin:14px 0 8px;" id="s9-title">—</h1>
          <p style="color:var(--ink-soft);font-size:13px;line-height:1.9;" id="s9-desc">—</p>
          <hr class="soft">
          <div class="head"><b data-i18n="req-docs-title">المستندات المطلوبة</b></div>
          <ul style="font-size:13px;color:var(--ink-soft);line-height:2;padding-inline-start:18px;margin:8px 0 0;" id="s9-docs"></ul>
          <p id="s9-note" style="font-size:12px;color:var(--ink-soft);margin:14px 0 0;background:var(--cream);border-radius:10px;padding:10px 12px;">💡 بعد تسجيل الدخول نملأ بياناتك الشخصية تلقائياً — ستحتاج فقط لرفع المستندات.</p>
        </div>
        <div>
          <div class="sys-review" style="margin-bottom:16px;">
            <div class="row"><span data-i18n="expected-duration">المدة المتوقعة</span><span id="s9-days">—</span></div>
            <div class="row"><span data-i18n="fees">الرسوم</span><span id="s9-fee">—</span></div>
            <div class="row"><span data-i18n="dept">القسم المختص</span><span id="s9-dept">—</span></div>
          </div>
          <button class="btn-gold" id="s9-start" style="width:100%;justify-content:center;" type="button" data-i18n="start-request">ابدأ الطلب</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
const state = loadState();
const svc = SERVICE_CATALOG[state.serviceId] || SERVICE_CATALOG['realestate-reg'];
document.getElementById('s9-icon').innerHTML = svc.icon;
function renderServiceDetails(){
  const item = getServiceCopy(svc);
  const guide = currentLang === 'en' ? 'Services Guide' : 'دليل الخدمات';
  document.getElementById('s9-breadcrumb').innerHTML = `${guide} / ${item.catLabel} / <b style="color:var(--velvet);">${item.title}</b>`;
  document.getElementById('s9-title').textContent = item.title;
  document.getElementById('s9-desc').textContent = item.desc;
  document.getElementById('s9-days').textContent = item.days;
  document.getElementById('s9-fee').textContent = item.fee;
  document.getElementById('s9-dept').textContent = item.dept;
  document.getElementById('s9-docs').innerHTML = item.docs.map(d=>`<li>${d}</li>`).join('');
  document.getElementById('s9-note').textContent = currentLang === 'en'
    ? '💡 After signing in, your personal details are filled automatically — you only need to upload the documents.'
    : '💡 بعد تسجيل الدخول نملأ بياناتك الشخصية تلقائياً — ستحتاج فقط لرفع المستندات.';
}
renderServiceDetails();
document.addEventListener('sh:langchange', renderServiceDetails);

const reduceMotionQ2 = window.matchMedia('(prefers-reduced-motion: reduce)');
document.getElementById('s9-start')?.addEventListener('click', (e)=>{
  const btn = e.currentTarget;
  if(!reduceMotionQ2.matches){
    const rect = btn.getBoundingClientRect();
    const ripple = document.createElement('span');
    ripple.className = 'pop-ripple';
    ripple.style.left = (e.clientX - rect.left) + 'px';
    ripple.style.top = (e.clientY - rect.top) + 'px';
    btn.style.position = 'relative';
    btn.appendChild(ripple);
    ripple.addEventListener('animationend', () => ripple.remove());
    btn.classList.add('btn-popping');
    btn.addEventListener('animationend', () => btn.classList.remove('btn-popping'), { once: true });
  }
  const delay = reduceMotionQ2.matches ? 0 : 190;
  window.setTimeout(()=>{
    /* يمر عبر بوابة تسجيل الدخول ثم صفحة بيانات المواطن (app.js → startServiceRequest) */
    startServiceRequest(state.serviceId && SERVICE_CATALOG[state.serviceId] ? state.serviceId : 'realestate-reg');
  }, delay);
});
</script>
</body>
</html>
