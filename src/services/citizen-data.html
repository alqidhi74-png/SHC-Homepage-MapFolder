<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بيانات المواطن — مدينة السلطان هيثم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-lang="ar" data-page="citizen">

<div class="page-canvas">
  <div class="site-frame">
    <div class="site-header">
      <div class="logo-group">
        <button class="back-arrow show" id="back-arrow-btn" type="button" aria-label="رجوع" title="رجوع"
          data-chapter="الفصل الثاني · تفاصيل الخدمة" data-line="اعرف المستندات والمدة قبل أن تبدأ"><span>→</span></button>
        <div class="logo-mark">SH</div>
        <div class="logo-word"><b data-i18n="brand-ar">مدينة السلطان هيثم</b><span data-i18n="brand-en">SULTAN HAITHAM CITY</span></div>
      </div>
      <div class="header-actions">
        <a class="header-svc-btn" href="services-catalog.html" data-dir="left" data-chapter="الفصل الأول · دليل الخدمات" data-line="اختر الخدمة، والباقي مرتّب لك">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M15 9l-2 6-6 2 2-6 6-2Z"/></svg>
          <span class="lbl" data-i18n="services-guide">دليل الخدمات</span>
        </a>
        <button class="header-icon-btn" id="header-lang-btn" type="button" title="تغيير اللغة">Ar / En</button>
        <button class="header-icon-btn device" id="header-device-btn" type="button" title="عرض النظام">📱</button>
      </div>
    </div>

    <div class="chapter-strip" style="--ch-accent:#D9C27E;">
      <div class="ch-mark">3</div>
      <div class="ch-text"><b>الفصل الثالث · بيانات المواطن</b><p>بياناتك جاهزة – راجعها وأكمل الناقص فقط</p></div>
      <div class="ch-spine"></div>
    </div>

    <div class="sys-wrap">
      <div class="sys-stepper" id="cz-stepper">
        <div class="sys-step now"><div class="num">1</div><div class="lbl" data-i18n="step-data">البيانات</div></div>
        <div class="sys-step-line"></div>
        <div class="sys-step"><div class="num">2</div><div class="lbl" data-i18n="step-docs">المستندات</div></div>
        <div class="sys-step-line"></div>
        <div class="sys-step"><div class="num">3</div><div class="lbl" data-i18n="step-review">المراجعة</div></div>
        <div class="sys-step-line"></div>
        <div class="sys-step"><div class="num">4</div><div class="lbl" data-i18n="step-confirm">التأكيد</div></div>
      </div>

      <form id="cz-form" novalidate autocomplete="on">
        <div id="cz-root" aria-live="polite"></div>
        <div id="cz-save-error"></div>
        <div class="save-bar" id="cz-savebar" hidden></div>
      </form>
    </div>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
/* =========================================================
   صفحة بيانات المواطن
   التدفق: تسجيل الدخول ← جلب بيانات المستخدم (CitizenAPI.getProfile)
   ← تعبئة تلقائية ← المستخدم يكمل الناقص / يعدّل ← حفظ (CitizenAPI.saveProfile)
   ← الانتقال لصفحة المستندات
   الحالات: loading · error · empty · ready · saving · saved · save-error
========================================================= */

let state = loadState();
let profile = null;          /* البيانات كما جاءت من "الخادم" (null = لا توجد بيانات) */
let draft = {};              /* القيم الحالية في النموذج */
let editing = new Set();     /* حقول موجودة مسبقاً فتحها المستخدم للتعديل */
let errors = {};
let phase = 'loading';       /* loading | error | ready */
let saving = false, saved = false, saveFailed = false;

const root = document.getElementById('cz-root');
const saveBar = document.getElementById('cz-savebar');
const saveErrorBox = document.getElementById('cz-save-error');
const hasRequest = !!state.type;
const svc = SERVICE_CATALOG[state.serviceId] || SERVICE_CATALOG['realestate-reg'];

const GROUPS = {
  id:      { ar: 'الهوية', en: 'Identity' },
  contact: { ar: 'التواصل', en: 'Contact' },
  address: { ar: 'العنوان', en: 'Address' },
};
const T = (ar, en) => currentLang === 'en' ? en : ar;
const labelOf = f => currentLang === 'en' ? f.en : f.label;
const hintOf = f => currentLang === 'en' ? (f.hintEn || '') : (f.hint || '');
const isLocked = f => !!f.locked && isFilled(profile?.[f.key]);

/* الحقول الناقصة تُحسب من بيانات الخادم الأصلية — حتى لا "تقفز" من مكانها أثناء الكتابة */
function missingFields(){ return CITIZEN_FIELDS.filter(f => !isFilled(profile?.[f.key])); }
function presentFields(){ return CITIZEN_FIELDS.filter(f => isFilled(profile?.[f.key])); }
function requiredRemaining(){ return CITIZEN_FIELDS.filter(f => f.required && !isFilled(draft[f.key])).length; }
function completion(){
  const req = CITIZEN_FIELDS.filter(f => f.required);
  return Math.round(req.filter(f => isFilled(draft[f.key])).length / req.length * 100);
}
function hasChanges(){
  return CITIZEN_FIELDS.some(f => String(draft[f.key] ?? '').trim() !== String(profile?.[f.key] ?? '').trim());
}

if(!hasRequest){
  document.getElementById('cz-stepper').style.display = 'none';
}

/* ---------------- عناصر الإدخال ---------------- */
function wilayatOptions(){
  const list = WILAYATS[draft.governorate] || Object.values(WILAYATS).flat();
  return list.map(w => `<option value="${escapeHtml(w)}" label="${escapeHtml(localizeCitizenText(w))}"></option>`).join('');
}

function inputHTML(f, opts = {}){
  const v = draft[f.key] ?? '';
  const id = 'cz-' + f.key;
  const err = errors[f.key];
  const common = `id="${id}" name="${f.key}" data-key="${f.key}" ${f.required ? 'required aria-required="true"' : ''} aria-invalid="${err ? 'true' : 'false'}" aria-describedby="${id}-msg"`;
  let control;
  if(f.type === 'select'){
    control = `<select ${common}><option value="">${T('— اختر —', '— Select —')}</option>${f.options.map(o => `<option value="${escapeHtml(o)}" ${o === v ? 'selected' : ''}>${escapeHtml(localizeCitizenText(o))}</option>`).join('')}</select>`;
  } else if(f.type === 'textarea'){
    control = `<textarea ${common} rows="3" ${f.autocomplete ? `autocomplete="${f.autocomplete}"` : ''} placeholder="${escapeHtml(hintOf(f))}">${escapeHtml(v)}</textarea>`;
  } else {
    const extra =
      (f.inputmode ? ` inputmode="${f.inputmode}"` : '') +
      (f.autocomplete ? ` autocomplete="${f.autocomplete}"` : '') +
      (f.list ? ` list="dl-${f.list}"` : '') +
      (f.key === 'phone' ? ' maxlength="8" placeholder="9XXXXXXX"' : '') +
      (f.key === 'civilId' ? ' maxlength="9"' : '') +
      (f.key === 'email' ? ' placeholder="name@example.com"' : '') +
      (f.key === 'wilayat' ? ` placeholder="${T('مثال: السيب', 'e.g. Seeb')}"` : '');
    const input = `<input ${common} type="${f.type || 'text'}" value="${escapeHtml(v)}" class="${f.ltr ? 'ltr-input' : ''}"${extra}>`;
    control = f.prefix ? `<div class="input-group" dir="ltr"><span class="prefix">${f.prefix}</span>${input}</div>` : input;
  }
  const full = opts.full || f.type === 'textarea';
  return `
    <div class="sys-field ${full ? 'full' : ''} ${err ? 'error' : ''}" id="fld-${f.key}">
      <label for="${id}">${escapeHtml(labelOf(f))}${f.required ? '<span class="req" aria-hidden="true">*</span>' : ` <small style="color:var(--ink-soft);font-weight:400;">(${T('اختياري', 'optional')})</small>`}</label>
      ${control}
      <div class="err-msg" id="${id}-msg" ${err ? '' : 'style="display:none;"'}>⚠ ${escapeHtml(err || '')}</div>
      ${hintOf(f) && f.type !== 'textarea' ? `<div class="hint">${escapeHtml(hintOf(f))}</div>` : ''}
    </div>`;
}

function rowHTML(f){
  if(editing.has(f.key)){
    return `<div class="cz-row editing" data-row="${f.key}">
      ${inputHTML(f, { full: true })}
      <div style="display:flex;justify-content:flex-end;"><button type="button" class="cz-edit" data-cancel="${f.key}">${T('إلغاء التعديل', 'Cancel edit')}</button></div>
    </div>`;
  }
  const changed = String(draft[f.key] ?? '').trim() !== String(profile?.[f.key] ?? '').trim();
  const action = isLocked(f)
    ? `<span class="cz-lock" title="${T('هذه البيانات مصدرها السجل المدني ولا يمكن تعديلها هنا', 'Sourced from the civil registry')}">🔒 ${T('من السجل المدني', 'Civil registry')}</span>`
    : `<button type="button" class="cz-edit" data-edit="${f.key}" aria-label="${T('تعديل', 'Edit')} ${escapeHtml(labelOf(f))}">✎ ${T('تعديل', 'Edit')}</button>`;
  return `<div class="cz-row" data-row="${f.key}">
    <span class="k">${escapeHtml(labelOf(f))}</span>
    <span class="v ${f.ltr ? 'ltr' : ''}">${escapeHtml(formatCitizenValue(f, draft[f.key]))}${changed ? `<span class="cz-changed">${T('معدّل', 'edited')}</span>` : ''}</span>
    ${action}
  </div>`;
}

/* ---------------- الحالات ---------------- */
function renderLoading(){
  root.innerHTML = `
    <div class="ui-card" aria-busy="true">
      <div style="display:flex;gap:14px;align-items:center;margin-bottom:18px;">
        <div class="skel" style="width:48px;height:48px;border-radius:50%;flex-shrink:0;"></div>
        <div style="flex:1;"><div class="skel" style="height:16px;width:38%;margin-bottom:8px;"></div><div class="skel" style="height:12px;width:64%;"></div></div>
      </div>
      ${Array.from({ length: 6 }, (_, i) => `<div class="cz-skel-row"><div class="skel" style="width:${60 + (i * 17) % 40}%"></div><div class="skel" style="width:${45 + (i * 23) % 45}%"></div></div>`).join('')}
      <p style="text-align:center;color:var(--ink-soft);font-size:12.5px;margin:16px 0 0;display:flex;gap:8px;align-items:center;justify-content:center;">
        <span class="btn-spinner" style="display:inline-block;color:var(--gold-dark);"></span>
        ${T('جارٍ جلب بياناتك من حسابك…', 'Fetching your details…')}
      </p>
    </div>`;
  saveBar.hidden = true;
}

function renderError(){
  root.innerHTML = `
    <div class="ui-card cz-state fade-in" role="alert">
      <div class="ic" style="background:var(--err-bg);color:var(--err);">⚠</div>
      <h2>${T('تعذّر جلب بياناتك', "We couldn't load your details")}</h2>
      <p>${T('حدث خطأ أثناء الاتصال بالخادم. تحقق من اتصالك ثم أعد المحاولة، أو أدخل بياناتك يدوياً.', 'A connection error occurred. Retry, or enter your details manually.')}</p>
      <div class="actions">
        <button type="button" class="btn-gold" id="cz-retry">↻ ${T('إعادة المحاولة', 'Retry')}</button>
        <button type="button" class="btn-ghost" id="cz-manual">${T('إدخال يدوي', 'Enter manually')}</button>
      </div>
    </div>`;
  saveBar.hidden = true;
  document.getElementById('cz-retry').addEventListener('click', load);
  document.getElementById('cz-manual').addEventListener('click', () => { profile = null; draft = {}; phase = 'ready'; render(); });
}

function bannerHTML(){
  const user = currentUser();
  const localizedName = localizeCitizenText(user?.name || '');
  const first = localizedName.split(' ')[0];
  const localizedInitial = localizedName.trim().charAt(0) || '؟';
  const missing = missingFields().filter(f => f.required).length;
  let msg;
  if(!profile) msg = T('لم نعثر على بيانات محفوظة لحسابك. أدخلها مرة واحدة وسنحفظها لطلباتك القادمة.', "We found no saved details for your account. Enter them once and we'll reuse them next time.");
  else if(missing) msg = T(`جلبنا بياناتك تلقائياً من حسابك. ينقصك <b>${missing}</b> ${missing === 1 ? 'حقل' : missing === 2 ? 'حقلان' : 'حقول'} فقط — أكملها للمتابعة.`, `We pre-filled your details. Only <b>${missing}</b> field(s) are missing.`);
  else msg = T('بياناتك مكتملة ✓ راجعها وعدّل ما يلزم ثم تابع.', 'Your details are complete ✓ Review and continue.');
  const pct = completion();
  return `
    <div class="cz-banner fade-in">
      <div class="cz-avatar" aria-hidden="true">${escapeHtml(localizedInitial)}</div>
      <div style="min-width:0;flex:1;">
        <h1>${hasRequest ? T('مرحباً ', 'Welcome, ') + escapeHtml(first) : T('بياناتي الشخصية', 'My details')}</h1>
        <p>${msg}</p>
        ${hasRequest ? `<p style="margin-top:4px;"><span class="st-chip st-uploaded" style="font-weight:600;">${T('الطلب', 'Request')}: ${escapeHtml(getServiceCopy(svc).title)}</span></p>` : ''}
      </div>
      <div class="cz-meter" aria-label="${T('اكتمال البيانات', 'Completion')} ${pct}%">
        <div class="ring" id="cz-ring" style="--p:${pct};"><span id="cz-pct">${pct}%</span></div>
        <small>${T('الاكتمال', 'Complete')}</small>
      </div>
    </div>`;
}

function renderReady(){
  const field = key => {
    const f = CITIZEN_FIELDS.find(item => item.key === key);
    const value = formatCitizenValue(f, draft[key]);
    return `<div class="citizen-reference-field">
      <span class="citizen-reference-label">${escapeHtml(labelOf(f))}</span>
      <strong class="citizen-reference-value ${f.ltr ? 'ltr' : ''}">${escapeHtml(value)}</strong>
      <svg class="citizen-reference-lock" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="10.5" width="11" height="9" rx="1.5"/><path d="M9 10.5V7.8a3 3 0 0 1 6 0v2.7"/></svg>
    </div>`;
  };
  root.innerHTML = `
    <section class="citizen-reference-card fade-in">
      <header class="citizen-reference-head">
        <span class="citizen-reference-title-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="m4 16-.8 4 4-.8L18.5 7.9l-3.2-3.2L4 16Z"/><path d="m13.8 6.2 3.2 3.2"/></svg>
        </span>
        <div><h2>${T('بياناتك المسجلة', 'Your registered details')}</h2><p>${T('يمكنك تعديل البيانات التي تحتاج إلى تحديث.', 'You can update any details that need changing.')}</p></div>
      </header>
      <div class="citizen-reference-divider"></div>
      <div class="citizen-reference-section-title">
        <span aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 20c.5-4.1 2.7-6.3 6.5-6.3s6 2.2 6.5 6.3"/></svg></span>
        <b>${T('البيانات الشخصية', 'Personal details')}</b>
      </div>
      <div class="citizen-reference-grid">
        ${['fullName','civilId','nationality','dob','governorate','wilayat'].map(field).join('')}
      </div>
      <div class="citizen-reference-divider"></div>
      <div class="citizen-reference-section-title">
        <span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7.2 3.5 10 7 8.4 9.2c1.1 2.4 3 4.3 5.4 5.4L16 13l3.5 2.8-1.2 3c-.4 1-1.5 1.6-2.6 1.3C9.5 18.7 5.3 14.5 3.9 8.3c-.3-1.1.3-2.2 1.3-2.6l2-2.2Z"/></svg></span>
        <b>${T('معلومات التواصل', 'Contact information')}</b>
      </div>
      <div class="citizen-reference-grid citizen-reference-contact">
        ${['phone','email'].map(field).join('')}
      </div>
    </section>
    <datalist id="dl-wilayat">${wilayatOptions()}</datalist>`;
  renderSaveBar();
}

function renderSaveBar(){
  saveBar.hidden = false;
  const remaining = requiredRemaining();
  const label =
    saving ? T('جارٍ الحفظ…', 'Saving…') :
    saved  ? T('✓ تم الحفظ', '✓ Saved') :
    !hasRequest ? T('حفظ البيانات', 'Save details') :
    hasChanges() ? T('حفظ ومتابعة', 'Save & continue') : T('تأكيد ومتابعة', 'Confirm & continue');
  const hint = saved
    ? (hasRequest ? T('ننقلك إلى المستندات…', 'Taking you to documents…') : T('تم حفظ بياناتك', 'Your details were saved'))
    : remaining
      ? T(`متبقٍ ${remaining} ${remaining === 1 ? 'حقل مطلوب' : 'حقول مطلوبة'}`, `${remaining} required field(s) left`)
      : T('كل البيانات جاهزة ✓', 'All set ✓');
  saveBar.innerHTML = `
    <span class="hint" id="cz-hint">${hint}</span>
    <div class="end">
      ${hasRequest ? `<button type="button" class="btn-ghost" id="cz-prev">${T('السابق', 'Back')}</button>` : ''}
      <button type="submit" class="btn-gold ${saving ? 'is-loading' : ''} ${saved ? 'is-success' : ''}" id="cz-save" ${saving || saved ? 'disabled' : ''} style="justify-content:center;">
        <span class="btn-spinner" aria-hidden="true"></span><span>${label}</span>
      </button>
    </div>`;
  document.getElementById('cz-prev')?.addEventListener('click', () => document.getElementById('back-arrow-btn').click());

  saveErrorBox.innerHTML = saveFailed ? `
    <div class="ui-alert err fade-in" role="alert" style="margin-top:16px;">
      <span aria-hidden="true">⚠</span>
      <div><b>${T('لم يتم حفظ البيانات', 'Your details were not saved')}</b>${T('حدث خطأ في الاتصال. بياناتك ما زالت في النموذج — اضغط حفظ للمحاولة مجدداً.', 'A connection error occurred. Your input is kept — press save to retry.')}</div>
    </div>` : '';
}

/* تحديث جزئي أثناء الكتابة (بدون إعادة رسم النموذج حتى لا يضيع التركيز) */
function updateMeta(){
  const pct = completion();
  const ring = document.getElementById('cz-ring');
  if(ring){ ring.style.setProperty('--p', pct); document.getElementById('cz-pct').textContent = pct + '%'; }
  const rem = document.getElementById('cz-remaining');
  if(rem){
    const n = missingFields().filter(f => f.required && !isFilled(draft[f.key])).length;
    rem.hidden = !n;
    rem.textContent = T('متبقٍ', 'left') + ' ' + n;
  }
  if(!saving && !saved) renderSaveBar();
}

function setFieldError(key, msg){
  if(msg) errors[key] = msg; else delete errors[key];
  const wrap = document.getElementById('fld-' + key);
  if(!wrap) return;
  wrap.classList.toggle('error', !!msg);
  const input = wrap.querySelector('[data-key]');
  input?.setAttribute('aria-invalid', msg ? 'true' : 'false');
  const m = wrap.querySelector('.err-msg');
  if(m){ m.style.display = msg ? 'block' : 'none'; m.textContent = msg ? '⚠ ' + msg : ''; }
}

function render(){
  if(phase === 'loading') renderLoading();
  else if(phase === 'error') renderError();
  else renderReady();
}

/* ---------------- التفاعل ---------------- */
root.addEventListener('input', e => {
  const key = e.target.dataset?.key;
  if(!key) return;
  let val = e.target.value;
  if(key === 'phone' || key === 'civilId'){       /* أرقام فقط (مع تحويل الأرقام العربية) */
    const clean = val.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g, '');
    if(clean !== val){ e.target.value = clean; val = clean; }
  }
  draft[key] = val;
  if(errors[key]){
    const f = CITIZEN_FIELDS.find(x => x.key === key);
    if(!validateCitizenField(f, val)) setFieldError(key, '');
  }
  saveFailed = false;
  updateMeta();
});

root.addEventListener('change', e => {
  if(e.target.dataset?.key === 'governorate'){
    const dl = document.getElementById('dl-wilayat');
    if(dl) dl.innerHTML = wilayatOptions();
  }
});

root.addEventListener('focusout', e => {
  const key = e.target.dataset?.key;
  if(!key) return;
  const f = CITIZEN_FIELDS.find(x => x.key === key);
  const v = String(draft[key] ?? '');
  if(v.trim() === '' && !errors[key]) return;   /* لا نزعج المستخدم بخطأ قبل أن يكتب */
  setFieldError(key, validateCitizenField(f, v));
});

root.addEventListener('click', e => {
  const edit = e.target.closest('[data-edit]');
  if(edit){
    editing.add(edit.dataset.edit);
    renderReady();
    const input = document.getElementById('cz-' + edit.dataset.edit);
    input?.focus();
    if(input?.setSelectionRange && input.type !== 'email' && input.type !== 'date') { try{ input.setSelectionRange(input.value.length, input.value.length); }catch(_){} }
    return;
  }
  const cancel = e.target.closest('[data-cancel]');
  if(cancel){
    const k = cancel.dataset.cancel;
    editing.delete(k);
    draft[k] = profile?.[k] ?? '';
    delete errors[k];
    renderReady();
    root.querySelector(`[data-edit="${k}"]`)?.focus();
  }
});

document.getElementById('cz-form').addEventListener('submit', e => { e.preventDefault(); save(); });

async function save(){
  if(saving || saved) return;

  /* تحقق من كل الحقول القابلة للتعديل */
  errors = {};
  CITIZEN_FIELDS.forEach(f => {
    if(isLocked(f)) return;
    const msg = validateCitizenField(f, draft[f.key]);
    if(msg) errors[f.key] = msg;
  });
  const bad = Object.keys(errors);
  if(bad.length){
    const missingKeys = missingFields().map(f => f.key);
    bad.forEach(k => { if(!missingKeys.includes(k)) editing.add(k); });
    renderReady();
    const first = document.getElementById('cz-' + bad[0]);
    first?.closest('.sys-field')?.scrollIntoView({ behavior: prefersReducedMotion() ? 'auto' : 'smooth', block: 'center' });
    setTimeout(() => first?.focus({ preventScroll: true }), 250);
    showToast(T(`يرجى مراجعة ${bad.length === 1 ? 'حقل واحد' : bad.length + ' حقول'}`, `Please fix ${bad.length} field(s)`), 'error');
    return;
  }

  saving = true; saveFailed = false;
  renderSaveBar();

  const clean = {};
  CITIZEN_FIELDS.forEach(f => { clean[f.key] = String(draft[f.key] ?? '').trim(); });

  try{
    const record = await CitizenAPI.saveProfile(currentUser().id, clean);
    const s = loadState();
    s.citizen = clean;
    saveState(s);
    state = s;
    saving = false; saved = true;
    renderSaveBar();
    showToast(T('تم حفظ بياناتك بنجاح', 'Your details were saved'), 'success');
    setTimeout(() => {
      if(hasRequest){
        navigateWithTransition('request-documents.html', 'up');
      } else {
        profile = record; draft = { ...record }; editing.clear(); saved = false;
        renderReady();
      }
    }, 750);
  } catch(_){
    saving = false; saveFailed = true;
    renderSaveBar();
    showToast(T('تعذّر حفظ البيانات، حاول مجدداً', 'Save failed — try again'), 'error');
  }
}

/* ---------------- التحميل ---------------- */
async function load(){
  phase = 'loading'; render();
  try{
    const data = await CitizenAPI.getProfile(currentUser().id);
    profile = data;
    draft = { ...(data || {}) };
    /* إن رجع المستخدم لهذه الصفحة خلال نفس الطلب نحتفظ بما أكّده سابقاً */
    if(state.citizen) draft = { ...draft, ...state.citizen };
    editing.clear(); errors = {};
    phase = 'ready';
  } catch(_){
    phase = 'error';
  }
  render();
}

document.addEventListener('sh:langchange', () => { if(phase) render(); });
document.addEventListener('sh:authchange', e => {
  if(!e.detail.loggedIn) navigateWithTransition('services-catalog.html', 'left');
});

document.addEventListener('DOMContentLoaded', () => {
  requireLogin(load, { onCancel: () => navigateWithTransition('services-catalog.html', 'left') });
});
</script>
</body>
</html>
