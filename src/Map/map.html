<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#300c16">
  <meta name="description" content="استكشف أحياء مدينة السلطان هيثم ومشاريعها ومرافقها على الخريطة التفاعلية.">
  <script>
    (() => {
      try {
        const lang = localStorage.getItem('sh_lang') === 'en' ? 'en' : 'ar';
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.dataset.shcPrelang = lang;
      } catch (_) {}
    })();
  </script>
  <style>html[data-shc-prelang="en"] body{visibility:hidden}</style>
  <title>مدينة السلطان هيثم | الخريطة التفاعلية</title>
  <link rel="icon" href="assets/logo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/map-v6.css">
  <link rel="stylesheet" href="../header.css">
  <link rel="stylesheet" href="css/map-design.css">
  <script src="../chatbot.js" defer data-shc-chatbot-loader></script>
</head>
<body>
<div class="app-shell">
  <header class="topbar map-topbar" aria-label="أدوات الحساب واللغة">
    <nav class="header-actions" aria-label="التنقل الرئيسي">
      <a class="account-link" href="/login" title="تسجيل الدخول"><span data-icon="user"></span><span class="visually-hidden" data-en="Log in">تسجيل الدخول</span></a>
      <a class="home-link" href="/#direct-access" title="رجوع"><span class="visually-hidden" data-en="Back">رجوع</span><span data-icon="arrow"></span></a>
    </nav>
    <div class="header-brand" aria-label="مدينة السلطان هيثم">
      <img src="../assets/logo.png" alt="">
      <img src="../assets/city-name.png" alt="مدينة السلطان هيثم">
    </div>
    <div class="map-language" role="group" aria-label="اختيار اللغة">
      <button type="button" data-language="ar" lang="ar" aria-pressed="true">Ar</button>
      <span aria-hidden="true">/</span>
      <button type="button" data-language="en" lang="en" aria-pressed="false">En</button>
    </div>
  </header>
  <main class="map-stage" data-mode="satellite">
    <div id="map" class="map-canvas" aria-label="خريطة مدينة السلطان هيثم"></div>
    <div class="map-vignette" aria-hidden="true"></div>
    <div class="map-content">
    <section class="search-dock" aria-label="البحث في المدينة">
      <div class="search-row">
        <button class="layers-trigger" id="layersTrigger" type="button" aria-expanded="true" aria-controls="layersPanel" aria-label="طبقات الخريطة"><span data-icon="layers"></span></button>
        <div class="search-box">
          <span data-icon="search" class="search-icon"></span>
          <input id="searchInput" type="search" autocomplete="off" placeholder="ابحث عن حي، مشروع، مرفق، رقم قطعة…" aria-label="ابحث في المدينة" aria-controls="searchResults" aria-expanded="false">
          <button class="clear-search" id="clearSearch" type="button" aria-label="مسح البحث" hidden><span data-icon="close"></span></button>
          <div class="search-results" id="searchResults" hidden></div>
        </div>
      </div>
      <div class="search-filters" role="group" aria-label="تصنيف الخريطة">
        <button type="button" data-category="all" class="on" aria-pressed="true"><span data-icon="grid"></span><span data-en="All">الكل</span></button>
        <button type="button" data-category="districts" aria-pressed="false"><span data-icon="project"></span><span data-en="Districts & projects">الأحياء والمشاريع</span></button>
        <button type="button" data-category="facilities" aria-pressed="false"><span data-en="Facilities">المرافق</span><span data-icon="services"></span></button>
        <button type="button" data-category="plots" aria-pressed="false"><span data-en="Land plots">قطع الأراضي</span><span data-icon="map"></span></button>
      </div>
    </section>
    <aside class="layers-panel open" id="layersPanel" aria-label="طبقات الخريطة">
      <div class="panel-head"><strong data-en="Map layers">الطبقات</strong><span data-icon="layers"></span><button type="button" id="closeLayers" aria-label="إغلاق الطبقات"><span data-icon="close"></span></button></div>
      <div class="layer-scroll">
        <section class="layer-group">
          <button class="group-title" type="button" aria-expanded="true"><span data-en="Districts & projects">الأحياء والمشاريع</span><span data-icon="project" class="group-icon"></span><span data-icon="chevron"></span></button>
          <div class="group-rows">
            <label class="layer-row"><input type="checkbox" data-layer="district-labels" checked><span class="check-ui"></span><span data-icon="project" class="mini-ico project"></span><span data-en="Districts & projects">الأحياء والمشاريع</span></label>
            <label class="layer-row"><input type="checkbox" data-layer="investment"><span class="check-ui"></span><span data-icon="investment" class="mini-ico investment"></span><span data-en="Investment plots">قطع استثمارية</span></label>
            <label class="layer-row"><input type="checkbox" data-layer="commercial"><span class="check-ui"></span><span data-icon="shopping" class="mini-ico shopping"></span><span data-en="Commercial areas">مناطق تجارية</span></label>
          </div>
        </section>
        <section class="layer-group">
          <button class="group-title" type="button" aria-expanded="true"><span data-en="Facilities & services">المرافق والخدمات</span><span data-icon="settings" class="group-icon"></span><span data-icon="chevron"></span></button>
          <div class="group-rows">
            <label class="layer-row"><input type="checkbox" data-layer="school" checked><span class="check-ui"></span><span data-icon="school" class="mini-ico school"></span><span data-en="Schools">المدارس</span></label>
            <label class="layer-row"><input type="checkbox" data-layer="health" checked><span class="check-ui"></span><span data-icon="health" class="mini-ico health"></span><span data-en="Healthcare">المرافق الصحية</span></label>
            <label class="layer-row"><input type="checkbox" data-layer="mosque" checked><span class="check-ui"></span><span data-icon="mosque" class="mini-ico mosque"></span><span data-en="Mosques">المساجد</span></label>
            <label class="layer-row"><input type="checkbox" data-layer="park" checked><span class="check-ui"></span><span data-icon="park" class="mini-ico park"></span><span data-en="Parks">الحدائق</span></label>
            <label class="layer-row"><input type="checkbox" data-layer="civic"><span class="check-ui"></span><span data-icon="civic" class="mini-ico civic"></span><span data-en="Government facilities">المرافق الحكومية</span></label>
            <label class="layer-row"><input type="checkbox" data-layer="shopping"><span class="check-ui"></span><span data-icon="shopping" class="mini-ico shopping"></span><span data-en="Shopping & hospitality">التسوق والضيافة</span></label>
          </div>
        </section>
        <section class="layer-group">
          <button class="group-title" type="button" aria-expanded="true"><span data-en="Planning & infrastructure">التخطيط والبنية التحتية</span><span data-icon="map" class="group-icon"></span><span data-icon="chevron"></span></button>
          <div class="group-rows">
            <label class="layer-row"><input type="checkbox" data-layer="districts" checked><span class="check-ui"></span><span data-icon="district" class="mini-ico district"></span><span data-en="District boundaries">حدود الأحياء</span></label>
            <label class="layer-row"><input type="checkbox" data-layer="boundary" checked><span class="check-ui"></span><span data-icon="district" class="mini-ico district"></span><span data-en="City boundary">حدود المدينة</span></label>
            <label class="layer-row"><input type="checkbox" data-layer="parcels" checked><span class="check-ui"></span><span data-icon="map" class="mini-ico district"></span><span data-en="Land parcels">قطع الأراضي</span></label>
            <label class="layer-row"><input type="checkbox" data-layer="roads" checked><span class="check-ui"></span><span data-icon="roads" class="mini-ico roads"></span><span data-en="Main roads">الطرق الرئيسية</span></label>
            <label class="layer-row"><input type="checkbox" data-layer="green" checked><span class="check-ui"></span><span data-icon="green" class="mini-ico park"></span><span data-en="Green corridors">المسارات الخضراء</span></label>
            <label class="layer-row"><input type="checkbox" data-layer="trees" checked><span class="check-ui"></span><span data-icon="park" class="mini-ico park"></span><span data-en="Trees">الأشجار</span></label>
            <label class="layer-row"><input type="checkbox" data-layer="water" checked><span class="check-ui"></span><span data-icon="water" class="mini-ico civic"></span><span data-en="Waterways">المسطحات المائية</span></label>
            <label class="layer-row"><input type="checkbox" data-layer="buildings" checked><span class="check-ui"></span><span data-icon="project" class="mini-ico buildings"></span><span data-en="Future buildings">المباني المستقبلية</span></label>
          </div>
        </section>
      <div class="panel-footer"><span class="live-dot"></span><span id="layerCount"></span><button id="resetLayers" type="button" data-en="Reset">إعادة ضبط</button></div>
      </div>
    </aside>
    <aside class="info-card hidden" id="infoCard" aria-label="تفاصيل المنطقة" inert>
      <div class="sheet-handle" aria-hidden="true"></div>
      <button class="card-close" id="closeCard" type="button" aria-label="إغلاق التفاصيل"><span data-icon="close"></span></button>
      <div class="card-cover"><img src="assets/district-card.jpg" alt="تصور معماري للمجتمع السكني"><span class="cover-badge"><i></i><span data-en="A city for the future">مدينة للمستقبل</span></span></div>
      <div class="card-content">
        <div class="title-row"><span class="district-emblem" data-icon="home"></span><div><h1 id="cardTitle">حي الياسمين</h1><p id="cardSubtitle">مجتمع سكني متكامل وحديث</p></div></div>
        <div class="card-tabs" role="tablist" aria-label="تفاصيل الحي">
          <button id="tab-overview" class="on" type="button" role="tab" aria-selected="true" aria-controls="tabContent" data-tab="overview" data-en="Overview">نظرة عامة</button>
          <button id="tab-facilities" type="button" role="tab" aria-selected="false" aria-controls="tabContent" data-tab="facilities" data-en="Facilities">المرافق</button>
          <button id="tab-photos" type="button" role="tab" aria-selected="false" aria-controls="tabContent" data-tab="photos" data-en="Photos">الصور</button>
        </div>
        <div id="tabContent" class="tab-content" role="tabpanel" aria-labelledby="tab-overview" tabindex="0"></div>
        <div class="card-actions">
          <button class="primary-cta" id="exploreBtn" type="button"><span data-icon="map"></span><span data-en="Explore the district">استكشف المنطقة</span><span class="cta-arrow" data-icon="arrow"></span></button>
          <a class="secondary-cta" id="threeDBtn" href="city3d.html"><span data-icon="cube"></span><span data-en="View in 3D">عرض ثلاثي الأبعاد</span></a>
        </div>
      </div>
    </aside>
    <div class="map-mode-switch" role="group" aria-label="نمط الخريطة">
      <button type="button" data-mode="satellite" class="mode on" aria-pressed="true"><span class="mode-thumb satellite"></span><b data-en="Satellite">قمر صناعي</b><span class="mode-check">✓</span></button>
      <button type="button" data-mode="plan" class="mode" aria-pressed="false"><span class="mode-thumb plan"></span><b data-en="Plan">مخطط</b><span class="mode-check">✓</span></button>
    </div>
    <nav class="view-switch" aria-label="طريقة استكشاف المدينة">
      <a href="city3d.html"><span data-en="Explore the city in 3D">استكشف المدينة 3D</span><span data-icon="cube"></span></a>
      <span class="view-divider" aria-hidden="true"></span>
      <a href="map.html" class="active" aria-current="page"><span data-en="2D map">الخريطة 2D</span><span data-icon="map"></span></a>
    </nav>
    <button class="locate-btn" id="locateBtn" type="button" aria-label="موقعي الحالي" title="موقعي الحالي"><span data-icon="locate"></span></button>
    <div class="map-tools" aria-label="أدوات الخريطة">
      <button type="button" id="northBtn" class="north-tool" aria-label="اتجاه الشمال" title="اتجاه الشمال"><span>N</span><i id="compassNeedle"></i></button>
      <div class="zoom-tools"><button type="button" id="zoomIn" aria-label="تكبير" title="تكبير"><span data-icon="plus"></span></button><button type="button" id="zoomOut" aria-label="تصغير" title="تصغير"><span data-icon="minus"></span></button></div>
      <button type="button" id="resetMap" aria-label="عرض المدينة كاملة" title="عرض المدينة كاملة"><span data-icon="locate"></span></button>
      <button type="button" id="tiltMap" aria-label="تغيير زاوية العرض" aria-pressed="true" title="تغيير زاوية العرض"><span data-icon="cube"></span></button>
    </div>
    <div class="source-badge"><i></i><span data-en="Interactive city masterplan · Illustrative data">مخطط المدينة التفاعلي · بيانات توضيحية</span></div>
    <div class="toast" id="toast" role="status" hidden></div>
    </div>
  </main>
</div>
<script>
  (() => {
    const lang = document.documentElement.lang === 'en' ? 'en' : 'ar';
    if (lang === 'en') {
      document.querySelectorAll('[data-en]').forEach((element) => { element.textContent = element.dataset.en; });
      document.querySelectorAll('[data-language]').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.language === lang)));
      document.title = 'Sultan Haitham City | Interactive map';
    }
    const back = document.querySelector('.home-link');
    if (back) {
      back.href = '/#direct-access';
      back.title = lang === 'en' ? 'Back' : 'رجوع';
    }
    document.documentElement.removeAttribute('data-shc-prelang');
  })();
</script>
<script src="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.js"></script>
<script src="js/shared/city/00-core.js"></script>
<script src="js/shared/city/10-config.js"></script>
<script src="js/shared/city/15-sites.js"></script>
<script src="js/shared/city/20-plan.js"></script>
<script src="js/pages/map-v6.js"></script>
</body>
</html>
